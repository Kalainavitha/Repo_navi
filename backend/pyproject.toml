[project]
name = "genplan-backend"
version = "0.1.0"
description = "Deterministic IT project planning API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pydantic>=2.10,<3.0",
  "pymupdf>=1.25,<2.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
